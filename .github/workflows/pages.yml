name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: Install browser for UI checks
        run: npx playwright install --with-deps chromium
      - name: Check Russian text
        run: npm run spellcheck
      - name: Lint source files
        run: npm run lint
      - name: Check TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Audit lecture structure and repeated content
        run: npm run audit:content
      - name: Check responsive lecture screens
        run: npm run test:smoke
      - name: Build static site
        run: npm run build:pages
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: /2026-PISID3-lecture
      - name: Validate QR codes
        run: npm run validate:qr
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
